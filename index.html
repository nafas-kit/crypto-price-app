<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قیمت لحظه‌ای ارزهای دیجیتال</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, "Segoe UI", sans-serif;
    background: #0f172a; color: #f1f5f9;
    min-height: 100vh; padding: 24px 16px 48px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; text-align: center; margin-bottom: 4px; }
  .sub { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
  .status {
    text-align: center; font-size: 12px; color: #94a3b8; margin-bottom: 16px;
  }
  .status.stale { color: #fbbf24; }
  .card {
    background: #1e293b; border: 1px solid #334155; border-radius: 14px;
    padding: 14px 16px; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .name { font-size: 16px; font-weight: bold; }
  .sym { font-size: 12px; color: #94a3b8; }
  .price { font-size: 18px; font-weight: bold; direction: ltr; }
  .change { font-size: 13px; direction: ltr; text-align: left; }
  .up { color: #4ade80; }
  .down { color: #f87171; }
  .note { text-align: center; color: #64748b; font-size: 12px; margin-top: 20px; line-height: 1.8; }
  button {
    display: block; margin: 18px auto 0; padding: 10px 28px;
    background: #2563eb; color: #fff; border: none; border-radius: 10px;
    font-family: inherit; font-size: 15px; cursor: pointer;
  }
  button:active { background: #1d4ed8; }
</style>
</head>
<body>
<div class="wrap">
  <h1>💰 قیمت لحظه‌ای ارزهای دیجیتال</h1>
  <p class="sub">برای دوستان گروه آپلندپرو — قیمت‌ها هر ۳۰ ثانیه تازه می‌شوند</p>
  <p class="status" id="status">در حال دریافت قیمت‌ها…</p>
  <div id="list"></div>
  <button onclick="loadPrices()">🔄 به‌روزرسانی</button>
  <p class="note">منبع قیمت: CoinGecko (رایگان، بدون نیاز به ثبت‌نام)<br>قیمت‌ها به دلار آمریکا هستند.</p>
</div>
<script>
var COINS = [
  { id: "bitcoin",     fa: "بیت‌کوین",  sym: "BTC" },
  { id: "ethereum",    fa: "اتریوم",    sym: "ETH" },
  { id: "solana",      fa: "سولانا",    sym: "SOL" },
  { id: "tether",      fa: "تتر",       sym: "USDT" },
  { id: "binancecoin", fa: "بایننس کوین", sym: "BNB" },
  { id: "ripple",      fa: "ریپل",      sym: "XRP" },
  { id: "dogecoin",    fa: "دوج‌کوین",  sym: "DOGE" },
  { id: "cardano",     fa: "کاردانو",   sym: "ADA" }
];
var API = "https://api.coingecko.com/api/v3/simple/price?ids="
  + COINS.map(function (c) { return c.id; }).join(",")
  + "&vs_currencies=usd&include_24hr_change=true";

function fmt(n) {
  return n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function render(data, stale) {
  var html = "";
  COINS.forEach(function (c) {
    var d = data[c.id];
    if (!d) return;
    var ch = d.usd_24h_change;
    var cls = ch >= 0 ? "up" : "down";
    var sign = ch >= 0 ? "▲ +" : "▼ ";
    html += '<div class="card"><div><div class="name">' + c.fa + '</div>'
      + '<div class="sym">' + c.sym + '</div></div>'
      + '<div><div class="price">$' + fmt(d.usd) + '</div>'
      + '<div class="change ' + cls + '">' + sign + fmt(ch) + '%</div></div></div>';
  });
  document.getElementById("list").innerHTML = html;
  var st = document.getElementById("status");
  var now = new Date().toLocaleTimeString("fa-IR");
  if (stale) {
    st.textContent = "⚠️ قیمت‌ها ممکن است قدیمی باشند — آخرین تلاش: " + now;
    st.className = "status stale";
  } else {
    st.textContent = "آخرین به‌روزرسانی: " + now;
    st.className = "status";
  }
}

function loadPrices() {
  fetch(API)
    .then(function (r) { if (!r.ok) throw new Error("bad response"); return r.json(); })
    .then(function (data) {
      localStorage.setItem("cryptoPrices", JSON.stringify(data));
      render(data, false);
    })
    .catch(function () {
      var cached = localStorage.getItem("cryptoPrices");
      if (cached) render(JSON.parse(cached), true);
      else document.getElementById("status").textContent = "⚠️ قیمت‌ها در دسترس نیست — اینترنت را چک کنید و دوباره تلاش کنید.";
    });
}

loadPrices();
setInterval(loadPrices, 30000);
</script>
</body>
</html>
